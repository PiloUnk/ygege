name: Build and push develop branch with patches

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      USE_PAT: ${{ secrets.GHCR_TOKEN != '' }}
      REGISTRY: ghcr.io
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute lowercase image name
        id: image
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream develop branch
        run: |
          git remote add upstream https://github.com/UwUDev/ygege.git || true
          git fetch upstream develop
          git worktree add -f upstream upstream/develop

      - name: Apply custom patches
        run: |
          cd upstream
          git apply ../patches/custom.patch

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (PAT if provided)
        if: env.USE_PAT == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to GHCR (GITHUB_TOKEN)
        if: env.USE_PAT != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        run: |
          cd upstream
          docker buildx build --provenance=false \
            --platform=linux/arm64,linux/amd64 \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --output=type=registry,push=true \
            --tag ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:develop \
            -f docker/Dockerfile .

      - name: Image tags summary
        run: |
          echo "### Docker Images Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:develop\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:develop" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
